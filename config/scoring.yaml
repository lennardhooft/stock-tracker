# Bottom Score configuration (CLAUDE.md section 6).
# Every enabled signal adds `weight` points when it fires. Owner decision: equal weights.
# Phase 1 implements T1, T2, T3 and S1. V1/V2 come in Phase 2 and are disabled until then.

signals:
  near_200w_ma:                  # T1: close <= 200-week SMA x (1 + tolerance)
    enabled: true
    weight: 1
    weeks: 200
    tolerance: 0.05
  weekly_rsi:                    # T2: weekly RSI (Wilder) below threshold
    enabled: true
    weight: 1
    period: 14
    below: 30
  drawdown:                      # T3: close at least min_pct below the 52-week high
    enabled: true
    weight: 1
    min_pct: 30
    lookback_days: 252
  valuation_pct:                 # V1 (Phase 2C): P/E (P/S if losses) vs its own 5–10y history
    enabled: true
    weight: 1
    years: 10
    below_percentile: 20
    min_years: 3                 # less history than this → n/a
  insider_buying:                # V2 (Phase 2C): net open-market insider buying (US only on free data)
    enabled: true
    weight: 1
    days: 90
  near_major_bottom:             # T4 (6.4/6.5): optional, off by default
    enabled: false
    weight: 1
    within_pct: 5
    min_touches: 2
  market_fear:                   # S1: VIX >= vix_above OR Fear & Greed <= fear_greed_below
    enabled: true
    weight: 1
    vix_above: 30
    fear_greed_below: 25

# Score labels (section 6.6). A score is matched against `min` from the top down.
labels:
  - { min: 6, key: extreme, text: "Extreme", colour: red }
  - { min: 4, key: strong, text: "Strong bottom signals, research it", colour: orange }
  - { min: 2, key: watch, text: "Watch", colour: yellow }
  - { min: 0, key: normal, text: "Normal", colour: grey }

alert_threshold: 4

# Data sanity checks (section 13.14 E)
data_checks:
  max_daily_move: 0.40           # bigger moves are checked for splits, else marked suspect
  stale_days: 3                  # unchanged close for this many trading days = stale
  max_gap_business_days: 5       # missing-data warning if bigger gap inside the last year

# Support / resistance levels (CLAUDE.md 6.5). Owner decision: multi-timeframe "real" levels.
levels:
  timeframes:                    # swing window (bars each side), min move away from the level, weight
    yearly:  { rule: "YE",    window: 2,  min_move: 0.30, weight: 4, label: "Y" }
    monthly: { rule: "ME",    window: 3,  min_move: 0.20, weight: 3, label: "M" }
    weekly:  { rule: "W-FRI", window: 8,  min_move: 0.12, weight: 2, label: "W" }
    daily:   { rule: null,    window: 10, min_move: 0.06, weight: 1, label: "D" }
  merge_pct: 3                   # swing points / zones within ±3 % merge
  major_move: 0.25               # a level is "major" if the move away from it was ≥ 25 %
  keep_per_side: 6               # zones stored above and below the price (the UI shows 3 per side)

# Quality Score 0–100 (CLAUDE.md 13.1, 13.16 A). Owner decision: equal weights,
# debt and ROIC slightly heavier (1.5×). Needs at least `min_parts` parts, else n/a.
quality:
  weights:
    piotroski: 1       # Piotroski F-score (0–9), last two annual reports
    altman: 1          # Altman Z bankruptcy risk (< 1.8 distress, > 3 safe); n/a for banks/insurers
    debt: 1.5          # net debt / EBITDA and interest coverage
    fcf: 1             # free cash flow positive in 3 of the last 4 years
    growth: 1          # revenue growth per year over 3 years
    margins: 1         # operating margin vs its own average
    dilution: 1        # share count change per year
    roic: 1.5          # ROIC & moat (ROE for banks/insurers)
  min_parts: 4
  high: 70             # ≥ 70 high · 40–70 medium · < 40 low
  medium: 40
  wacc: 0.085          # estimated cost of capital for "ROIC beats its cost of capital"

# Top Score: when to consider trimming (13.14 A). Labels 0–1 normal, 2–3 getting hot, 4+ trim.
top_signals:
  far_above_trend:  { enabled: true, weight: 1, weeks: 200, multiple: 1.8 }    # U1
  weekly_rsi_high:  { enabled: true, weight: 1, period: 14, above: 70, extreme: 80 }  # U2
  expensive:        { enabled: true, weight: 1, above_percentile: 90, min_years: 3 }  # U3
  insider_selling:  { enabled: true, weight: 1, min_pct_of_mcap: 0.05 }        # U4 (US only)
  euphoria:         { enabled: true, weight: 1, fear_greed_above: 75 }         # U5
  near_resistance:  { enabled: true, weight: 1, within_pct: 3 }                # U6
