# Taxes and costs for a Belgian investor, used only for ESTIMATES (dividend forecast, tax overview).
# VERIFY these against the current Belgian rules (FOD Financiën) and your broker before relying on them.
# The browser has a copy in web/lib/costs.js (tests/test_costs.py checks they're identical).
dividend_tax:
  # roerende voorheffing, charged on what's left after the foreign withholding
  belgium: 0.30
  # foreign withholding by country (approximated from the listing exchange of the stock)
  foreign:
    US: 0.15  # with a W-8BEN form at your broker; otherwise 0.30
    CA: 0.25
    NL: 0.15
    DE: 0.26375
    FR: 0.25
    CH: 0.35
    GB: 0.0
    IE: 0.25
    DK: 0.27
    SE: 0.30
    "NO": 0.25  # quoted: plain NO means "false" in YAML
    FI: 0.35
    ES: 0.19
    IT: 0.26
    PT: 0.25
    AT: 0.275
    BE: 0.0
  # UCITS ETFs (Ireland / Luxembourg) usually pay out without withholding at fund level
  etf_foreign: 0.0
  # Yahoo ticker suffix → country ("" = no suffix = US)
  suffix_country:
    "": US
    .TO: CA
    .V: CA
    .NE: CA
    .AS: NL
    .DE: DE
    .F: DE
    .PA: FR
    .SW: CH
    .L: GB
    .IR: IE
    .CO: DK
    .ST: SE
    .OL: "NO"
    .HE: FI
    .MC: ES
    .MI: IT
    .LS: PT
    .VI: AT
    .BR: BE
  # pay date when Yahoo only knows the ex-dividend date
  pay_days_after_ex: 21
capital_gains:
  # which purchase a sale comes from: fifo (first in, first out) or average
  method: fifo
# Stock-exchange tax (TOB, beurstaks) per order, rate and maximum per transaction (EUR).
# ETFs: most UCITS ETFs pay 0,12 %; accumulating funds registered in Belgium pay 1,32 %. Check yours.
tob:
  stock: { rate: 0.0035, max: 1600 }
  etf: { rate: 0.0012, max: 1300 }
  etf_be_accumulating: { rate: 0.0132, max: 4000 }
# Bolero brokerage fee per order (tariff sheet "101 tarieven", read 22 Nov 2026 from bolero.be/nl/tarieven).
# tiers: [order value up to, fee]; then `mid` up to 70.000 (fee per started block, capped) and `high` above it,
# or `rest`: a percentage with a minimum. Amounts in the market's fee currency. VERIFY: tariffs change.
broker:
  name: Bolero
  markets:
    euronext:
      suffixes: [.BR, .PA, .AS, .LS, .IR, .MI, .OL]
      currency: EUR
      tiers: [[250, 2.5], [1000, 5.0], [2500, 7.5]]
      mid: { up_to: 70000, block: 10000, fee: 15, max: 50 }
      high: { base: 50, block: 10000, fee: 15 }
    germany:
      suffixes: [.DE, .F]
      currency: EUR
      tiers: [[250, 2.5], [1000, 5.0], [2500, 15.0]]
      mid: { up_to: 70000, block: 10000, fee: 30, max: 60 }
      high: { pct: 0.0015 }
    europe:
      suffixes: [.ST, .SW, .L, .MC, .CO, .HE, .VI]
      currency: EUR
      tiers: [[250, 2.5], [1000, 5.0], [2500, 15.0]]
      rest: { pct: 0.005, min: 30 }
    toronto:
      suffixes: [.TO, .V, .NE]
      currency: EUR
      tiers: [[250, 2.5], [1000, 5.0], [2500, 15.0]]
      rest: { pct: 0.005, min: 20 }
    us:
      suffixes: [""]
      currency: USD
      tiers: [[250, 2.5], [1000, 5.0], [2500, 15.0]]
      mid: { up_to: 70000, block: 10000, fee: 20, max: 50 }
      high: { base: 50, block: 10000, fee: 20 }
  # currency exchange on non-EUR orders: not in the tariff sheet the app read → not included (null)
  fx_pct: null
