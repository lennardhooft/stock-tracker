<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Style guide · Bottom Tracker</title>
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="design/components.css">
  <style>
    /* style-guide-only layout helpers (not used by the app) */
    .sg-section { margin-bottom: var(--space-12); scroll-margin-top: calc(var(--topbar-h) + var(--space-4)); }
    .sg-section > h2 { margin-bottom: var(--space-2); }
    .sg-section > p { color: var(--color-text-2); margin-bottom: var(--space-4); font-size: var(--text-sm); }
    .sg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-3); }
    .sg-swatch { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
    .sg-swatch__chip { height: 48px; }
    .sg-swatch__name { padding: var(--space-2); font-size: var(--text-xs); font-family: var(--font-mono); color: var(--color-text-2); word-break: break-all; }
    .sg-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-bottom: var(--space-3); }
    .sg-label { font-size: var(--text-xs); color: var(--color-muted); font-family: var(--font-mono); margin-bottom: var(--space-1); }
    .sg-demo { display: flex; flex-direction: column; gap: var(--space-1); }
    .sg-box { background: var(--color-accent); opacity: 0.6; height: 16px; border-radius: 2px; }
    .sg-elev { width: 120px; height: 64px; border-radius: var(--radius-md); background: var(--color-raised); display: grid; place-items: center; font-size: var(--text-xs); color: var(--color-muted); }
    .sg-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: var(--space-2); }
    .sg-icons div { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-2); font-size: var(--text-xs); color: var(--color-text-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    .sg-shell { border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; position: relative; }
    .sg-shell .topbar, .sg-shell .tabbar { position: static; }
    .sg-shell .tabbar { display: flex; }
    .sg-two { display: grid; gap: var(--space-4); }
    @media (min-width: 768px) { .sg-two { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Main">
      <div class="rail__brand" data-i18n="app.name">Bottom Tracker</div>
      <a class="rail__item" href="#today" aria-current="page" id="rail-today"></a>
      <a class="rail__item" href="#watchlist" id="rail-watchlist"></a>
      <a class="rail__item" href="#more" id="rail-more"></a>
    </nav>

    <div>
      <header class="topbar">
        <h1 class="topbar__title" data-i18n="styleguide.title">Style guide</h1>
        <div class="topbar__actions">
          <button type="button" class="freshness" data-state="fresh" id="fresh" aria-label="Data is up to date"><span class="freshness__dot"></span></button>
          <button type="button" class="icon-btn" id="lang" aria-label="Switch language">NL</button>
          <button type="button" class="icon-btn" id="theme" aria-label="Switch theme"></button>
        </div>
      </header>

      <main class="content" id="sg">
        <p class="muted">Loading…</p>
      </main>
    </div>
  </div>

  <nav class="tabbar" aria-label="Main" id="tabbar"></nav>

  <script type="module" src="styleguide.js"></script>
</body>
</html>
