name: intraday

# Every 15 minutes on weekdays, 07:00–21:59 UTC: covers Euronext (09:00–17:30 Brussels) and the
# US session (09:30–16:00 New York) in summer and winter time. The script itself checks whether a
# market is open (DST, holidays) and exits within seconds when none is.
on:
  schedule:
    - cron: "*/15 7-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if markets are closed (testing)"
        type: boolean
        default: false

concurrency:
  group: intraday
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Intraday checks
        run: python -m src.run_intraday ${{ inputs.force && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
