[project]
name = "stock-tracker"
version = "0.1.0"
description = "Personal Stock Bottom Tracker (Phase 1)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP017", "UP047"]  # keep syntax that also runs on older local Pythons

[tool.pytest.ini_options]
testpaths = ["tests"]
